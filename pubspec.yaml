name: yumeiro
description: A generic Flutter UI framework driven by extensible semantic recipes, pluggable material effect passes, and unified touch/pointer modality adaptation.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.1.7
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/liquid_glass.frag
