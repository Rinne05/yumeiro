name: Check Yumeiro

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      FLUTTER_VERSION: 3.50.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test library
        run: flutter test --no-pub
      - name: Test example
        working-directory: example
        run: flutter test --no-pub
      - name: Set up the software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers
      - name: Test optical materials with Impeller
        working-directory: example
        run: |
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${drivers[0]}"
          export VK_DRIVER_FILES="${drivers[0]}"
          flutter test --no-pub --enable-impeller \
            --dart-define=YUMEIRO_REQUIRE_OPTICAL=true \
            test/glass_*_test.dart test/gallery_optical_options_test.dart \
            test/theme_material_rendering_test.dart test/material_opacity_test.dart
      - name: Build documentation and Web examples
        run: |
          npm --prefix docs ci
          npm --prefix docs run build
      - name: Rehearse package validation
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 tool/check_package.py --repository "$REPOSITORY_URL"
